<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <rect width="100" height="100" rx="16" fill="#f1f5f9"/>
  <!-- iPhone body -->
  <rect x="30" y="12" width="40" height="76" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="32" y="14" width="36" height="72" rx="8" fill="#0f172a"/>
  <!-- Wallpaper gradient -->
  <rect x="32" y="14" width="36" height="72" rx="8" fill="url(#ipGrad)"/>
  <!-- Dynamic Island -->
  <rect x="43" y="17" width="14" height="4" rx="2" fill="#000"/>
  <!-- Camera bump on back subtle reflection -->
  <circle cx="50" cy="50" r="12" fill="#38bdf8" fill-opacity="0.2"/>
  <defs>
    <linearGradient id="ipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
</svg>